name: Dependency review

# On a pull request: flags any dependency it adds or changes that has a known vulnerability, or a
# licence that can't be shipped with Disc Detective.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0, AGPL-3.0, GPL-2.0, GPL-3.0
          comment-summary-in-pr: on-failure
