name: Issue labels

# A bug report's System answer (its form's dropdown) as a label: windows, macos or linux, so whoever looks after a
# system can watch its own. Added when the issue is opened, and changed with the answer if it's edited.

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  system:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            // (the form writes each answer under its label: "### System" then the choice)
            const m = body.match(/^###\s+System\s*\r?\n+\s*(Windows|macOS|Linux)\s*$/mi);
            if (!m) return;
            const want = m[1].toLowerCase();
            const systems = ["windows", "macos", "linux"];
            const have = context.payload.issue.labels.map(l => l.name);
            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number };
            for (const name of have.filter(n => systems.includes(n) && n !== want)) {
              await github.rest.issues.removeLabel({ ...issue, name });
            }
            if (!have.includes(want)) {
              await github.rest.issues.addLabels({ ...issue, labels: [want] });
            }
