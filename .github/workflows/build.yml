name: Build

# The download-and-run packages (release/build.py): one per system, each built on that system, its self-check
# run on the built program. By hand (Actions > Build > Run workflow), on a pull request that changes the build,
# and on a version tag (v0.3...): then a draft release is made with the three zips, for you to check and publish.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "release/**"
      - "pyproject.toml"
      - ".github/workflows/build.yml"
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the app and PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Windows" ]; then pip install ".[windows-ocr]" pyinstaller; else pip install . pyinstaller; fi
      - name: Build (Linux, with a virtual display for the self-check's window)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb >/dev/null
          xvfb-run -a python release/build.py
      - name: Build
        if: runner.os != 'Linux'
        run: python release/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: disc-detective-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - name: Draft release with the three packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" zips/*.zip --repo "${GITHUB_REPOSITORY}" --draft --generate-notes --title "Disc Detective ${GITHUB_REF_NAME#v}"
