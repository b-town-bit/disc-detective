name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

# a newer push to the same branch or pull request replaces a run still going
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check --output-format github .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # the oldest and newest supported
        python: ["3.9", "3.14"]
        # Python 3.9 isn't built for Ubuntu 26.04 (ubuntu-latest since Oct 2026): test it on 24.04
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Tests (Linux, with a virtual display for the app tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb >/dev/null
          xvfb-run -a pytest -q
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: pytest -q
