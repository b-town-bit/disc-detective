name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

# a newer push to the same branch or pull request replaces a run still going
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check --output-format github .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # the oldest and newest supported
        python: ["3.9", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # pictures of the app's windows on each system (the newest Python's run), saved below
      DISC_DETECTIVE_SCREENSHOTS: ${{ matrix.python == '3.14' && format('{0}/screenshots', github.workspace) || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Tests (Linux, with a virtual display for the app tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb >/dev/null
          xvfb-run -a pytest -q
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: pytest -q
      - name: Tests (macOS)
        if: runner.os == 'macOS'
        run: pytest -q
      - name: Screenshots
        if: always() && matrix.python == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ runner.os }}
          path: screenshots/
          if-no-files-found: ignore
