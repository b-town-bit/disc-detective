name: Contributor agreement

# Asks the author of each pull request to sign CLA.md once, by commenting on it, before it can be
# merged. Signatures are kept in signatures/cla.json on the cla-signatures branch (main is
# protected: nothing is pushed to it but through a pull request). It never runs a pull request's code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Contributor agreement
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/b-town-bit/disc-detective/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # (the owner and bots don't sign)
          allowlist: b-town-bit,dependabot[bot],github-actions[bot]
